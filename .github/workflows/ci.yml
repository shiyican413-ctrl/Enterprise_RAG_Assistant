name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      VECTOR_STORE_BACKEND: local
      DATABASE_URL: ""
      DASHSCOPE_API_KEY: ""
      JWT_SECRET: ci-only-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend Typecheck And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/next-web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/next-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: enterprise-rag-assistant-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/next-web
          file: ./frontend/next-web/Dockerfile
          push: false
          tags: enterprise-rag-assistant-frontend:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8000
